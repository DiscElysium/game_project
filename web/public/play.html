<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>假面骰子 · 在线游戏</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/play.css"></head>
<body><header><div class="identity"><span class="dice" aria-hidden="true">⚄</span><div><h1>假面骰子</h1><p>MASKED LIAR’S DICE</p></div></div><div class="tools"><span id="ai-status" role="status">正在准备牌桌</span><button id="fullscreen" disabled>全屏游戏 ↗</button></div></header>
<div class="play-area"><main><div class="game-frame"><canvas id="unity-canvas" width="1600" height="900" tabindex="0" aria-label="假面骰子游戏画面"></canvas><div id="loading"><span class="eyebrow">请入座</span><h2 id="loading-title">正在布置牌桌</h2><progress id="progress" max="1" value="0"></progress><p id="loading-message">首次加载约 16 MB，稍候即可开始。</p><button id="retry" hidden>重新加载</button></div></div></main>
<section id="game-ui" aria-label="游戏操作"><div class="readout"><span id="round-status">请入座</span><span id="bid-status">尚未叫牌</span></div><p id="hand"></p><p id="peek"></p><p id="micro" aria-live="polite"></p><p id="decision" aria-live="polite"></p><div class="actions"><button id="begin" disabled>进入牌桌</button><div id="bid-controls" hidden><label>数量 <input id="quantity" type="number" min="1" max="60" value="1"></label><label>点数 <select id="point"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option></select></label><button id="bid" disabled>叫牌</button><button id="challenge" disabled>质疑</button></div><div id="special-controls" hidden><span>选择本回合特殊行动</span><select id="target" aria-label="行动目标"><option value="1">NPC 1</option><option value="2">NPC 2</option><option value="3">NPC 3</option></select><button id="xray">透视</button><select id="guess" aria-label="猜测特殊骰子点数"><option value="1">猜 1 点</option><option value="2">猜 2 点</option><option value="3">猜 3 点</option><option value="4">猜 4 点</option><option value="5">猜 5 点</option><option value="6">猜 6 点</option></select><button id="steal">偷窃</button><button id="skip">跳过</button></div></div></section></div>
<footer><span>读懂微表情，藏好你的谎言。</span><span>DeepSeek AI · 1-BIT</span></footer><script src="/play.js"></script></body></html>
